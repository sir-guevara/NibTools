[package]
name = "nibpass"
version = "0.1.0"
edition = "2024"
description = "Fast self-managed password manager with git and OTP support"
license = "MIT"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1.8"
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"], optional = true }

[features]
default = []
gui = ["gtk"]
