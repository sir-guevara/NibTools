[package]
name = "nibnotes"
version = "0.1.0"
edition = "2024"
description = "Fast local-first Markdown notes"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
sourceview = { package = "sourceview5", version = "0.10" }
glib = "0.21"
gio = "0.21"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
